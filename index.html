        <h1>WTI Crude Oil Futures: volatility forecaster and leak post-mortem</h1>
        <p>
          This dashboard needs JavaScript to load its data snapshot and chart. In short: the project's
          original 1-week price-direction signal backtested strongly, but an audit showed the whole edge
          was a look-ahead leak. With a proper purge/embargo it is a coin flip, so the signal is retracted
          and no trading stance is shown.
        </p>
        <p>
          What does hold up is volatility: a HAR-IV model (realized volatility plus the OVX implied-vol
          index) forecasts next-week volatility direction with statistically significant, leak-free
          out-of-sample skill. It is a risk and regime indicator, not a source of trading profit. The site
          also includes an EIA supply-shock event study of how WTI responded to historical disruptions.
        </p>
        <p>
          Full write-up and code:
