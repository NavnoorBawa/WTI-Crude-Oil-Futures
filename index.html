      <main class="noscript">
        <h1>WTI Volatility Research</h1>
        <p>
          This page needs JavaScript to load its data snapshot and charts. It forecasts next-week realized
          volatility of WTI crude futures with a HAR model that uses the previous session's OVX, and
          evaluates it out of sample against benchmark models (GARCH, EWMA, HAR variants, machine
          learning, raw implied vol) with QLIKE loss, Diebold-Mariano tests, a Model Confidence Set,
          VaR backtests and conformal intervals.
        </p>
        <p>
          An earlier 1-week price-direction model was retracted: its backtest relied on a look-ahead
          leak, and with a proper purge it is a coin flip. The page shows that post-mortem, not a signal.
        </p>
