version: 2

# Minor and patch updates are grouped, one PR per group per week instead of one per package. Under
# the ruleset's up-to-date requirement, ungrouped PRs went stale one after another and had to be
# landed by hand as batches; a grouped PR is verified by CI as the set that will actually ship.
# Major versions are left out of the groups and arrive as their own PRs, because they need a
# deliberate review (e.g. upload-artifact and download-artifact, paired across refresh.yml's jobs).
# The one exception is the react group: react, react-dom and their types must move in lockstep, so
# that group takes every update type, majors included, in a PR of its own.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # requirements-dev.txt pins only releases at least two weeks old; the cooldown makes
    # Dependabot wait as long, so it never proposes a version the policy would hold back.
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:27"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # requirements-dev.txt pins only releases at least two weeks old; the cooldown makes
    # Dependabot wait as long, so it never proposes a version the policy would hold back.
    cooldown:
      default-days: 14
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:37"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # requirements-dev.txt pins only releases at least two weeks old; the cooldown makes
    # Dependabot wait as long, so it never proposes a version the policy would hold back.
    cooldown:
      default-days: 14
    groups:
      python:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # The Dockerfile's two base images, pinned by digest (the reproduce container, ROADMAP 1.6).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:47"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    # Image digests are dependencies too: the same two-week wait as every other pin.
    cooldown:
      default-days: 14
