name: Tests

# Fast, deterministic checks for every pull request and every change to main. A
# feature branch is checked by its pull request, so pushes to it do not run the
# workflow a second time. The scheduled data/state bot uses [skip ci], so its
# evidence-only commits do not consume runners.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Re-check dependencies when new vulnerability advisories are published.
    - cron: '31 6 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pins the tools (mypy and stubs, hypothesis, coverage, ruff, bandit,
        # pip-audit), so CI and a local `pip install -r requirements-dev.txt` run the same versions.
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-dev.txt
          python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Lint Python
        run: ruff check backend/ scripts/ tests/ freeze.py ./*.py --select F,E9

      - name: Type-check (mypy strict; scope in pyproject.toml)
        run: python -m mypy

      - name: Scan Python for insecure constructs
        run: python -m bandit -q -r backend scripts freeze.py

      - name: Run unit tests with branch coverage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: python -B -m coverage run --branch -m unittest discover -s tests -v

      - name: Report coverage
        # The table goes to the run's summary page and the XML/HTML reports to an artifact; the last
        # command is the gate (fail_under in pyproject.toml).
        run: |
          set -euo pipefail
          python -m coverage xml -o coverage.xml --fail-under=0
          python -m coverage html -d htmlcov --fail-under=0
          {
            echo "### Python coverage (statements and branches)"
            echo
            python -m coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

      - name: Generated docs match the committed artifacts
        # Every number in the README, the model card and the datasheet is generated from data/*.json
        # by scripts/readme_blocks.py, and every figure by scripts/make_figures.py; neither may drift.
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m cogapp --check --diff --check-fail-msg='run: PYTHONPATH=. cog -r README.md docs/MODEL_CARD.md docs/DATASHEET.md' \
            README.md docs/MODEL_CARD.md docs/DATASHEET.md
          python -B scripts/make_figures.py
          git diff --exit-code --stat -- docs/figures

      - name: Validate checked-in dashboard fixture
        run: python scripts/validate_frozen_payload.py tests/fixtures/valid_frozen_payload.json

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure resilient npm downloads
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "npm registry error; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Lint frontend
        run: npm run lint

      - name: Test dashboard logic
        run: npm test

      - name: Audit JS dependencies
        # Production dependencies (what ships in the static site): a real advisory fails this step
        # on every event. The full tree (dev tooling included: eslint, vite) is strict on pull
        # requests, pushes and manual runs; on the weekly schedule a dev-only advisory is a warning
        # annotation instead, so an upstream advisory in build tooling, with no fix to take yet,
        # does not turn main's badge red between pull requests. A registry or network error from
        # the advisory endpoint is retried, then only warned: an unreachable audit endpoint is not
        # a vulnerability.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Prints the audit; returns 0 when clean or unreachable after retries, 1 on an advisory.
          audit() {
            local scope="$1"
            shift
            local attempt output
            for attempt in 1 2 3; do
              if output="$(npm audit --audit-level=low "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if printf '%s' "$output" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|socket hang up|fetch failed'; then
                echo "npm audit (${scope}) registry/network error on attempt ${attempt}" >&2
                if [ "$attempt" -eq 3 ]; then
                  echo "::warning title=npm audit unreachable::The npm advisory endpoint was unreachable after 3 attempts, so the ${scope} audit was skipped for this run. It is re-run on every pull request and on the weekly Tests schedule."
                  return 0
                fi
                sleep $((attempt * 20))
                continue
              fi
              printf '%s\n' "$output"
              return 1
            done
          }

          echo "::group::npm audit --omit=dev (production dependencies)"
          audit production --omit=dev
          production=$?
          echo "::endgroup::"
          if [ "$production" -ne 0 ]; then
            echo "::error title=npm audit (production)::A production dependency has a known advisory."
            exit 1
          fi

          echo "::group::npm audit (all dependencies, dev tooling included)"
          audit all
          all=$?
          echo "::endgroup::"
          if [ "$all" -ne 0 ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::warning title=npm audit (dev tooling)::A development-only dependency has a known advisory (production dependencies are clean). Scheduled runs report it as a warning; pull requests and pushes still fail on it."
              exit 0
            fi
            echo "::error title=npm audit (dev tooling)::A development dependency has a known advisory."
            exit 1
          fi

      - name: Build static site
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

  workflow-hygiene:
    name: Workflows and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned workflow scanners
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TOOL_DIR: ${{ runner.temp }}/workflow-tools
        run: |
          set -euo pipefail
          mkdir -p "$TOOL_DIR"

          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}" \
            --output "$TOOL_DIR/$actionlint_archive"
          echo "${ACTIONLINT_SHA256}  ${TOOL_DIR}/${actionlint_archive}" | sha256sum --check
          tar -xzf "$TOOL_DIR/$actionlint_archive" -C "$TOOL_DIR" actionlint

          gitleaks_archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gitleaks_archive}" \
            --output "$TOOL_DIR/$gitleaks_archive"
          echo "${GITLEAKS_SHA256}  ${TOOL_DIR}/${gitleaks_archive}" | sha256sum --check
          tar -xzf "$TOOL_DIR/$gitleaks_archive" -C "$TOOL_DIR" gitleaks

      - name: Validate GitHub Actions
        env:
          TOOL_DIR: ${{ runner.temp }}/workflow-tools
        run: |
          "$TOOL_DIR/actionlint" -shellcheck shellcheck

      - name: Scan the tracked tree for new secrets
        env:
          TOOL_DIR: ${{ runner.temp }}/workflow-tools
          SCAN_DIR: ${{ runner.temp }}/tracked-source
        run: |
          mkdir -p "$SCAN_DIR"
          git archive HEAD | tar -x -C "$SCAN_DIR"
          "$TOOL_DIR/gitleaks" dir --redact=100 --no-banner "$SCAN_DIR"

      - name: Scan new commit history for secrets
        env:
          TOOL_DIR: ${{ runner.temp }}/workflow-tools
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            scan_range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ] && git cat-file -e "${BEFORE_SHA}^{commit}"; then
            scan_range="${BEFORE_SHA}..${HEAD_SHA}"
          elif [ "$BEFORE_SHA" = "$zero_sha" ] && [ -n "$DEFAULT_BRANCH" ]; then
            default_ref="origin/${DEFAULT_BRANCH}"
            base_sha="$(git merge-base "$HEAD_SHA" "$default_ref" 2>/dev/null || true)"
            if [ -n "$base_sha" ] && [ "$base_sha" != "$HEAD_SHA" ]; then
              scan_range="${base_sha}..${HEAD_SHA}"
            elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              scan_range="${HEAD_SHA}^..${HEAD_SHA}"
            else
              scan_range="$HEAD_SHA"
            fi
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            scan_range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            scan_range="$HEAD_SHA"
          fi
          "$TOOL_DIR/gitleaks" git --redact=100 --no-banner --log-opts="$scan_range" .
