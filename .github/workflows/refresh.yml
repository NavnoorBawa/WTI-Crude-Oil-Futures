name: Refresh frozen dashboard

# Re-freezes the live data into static JSON and redeploys the site to GitHub Pages.
# No running server required — the published site is pure static HTML/JS + a data.json
# snapshot. If a run fails (e.g. an upstream API is rate-limited), the previous good
# snapshot stays live and the next scheduled run retries.

on:
  schedule:
    # Every 4 hours (UTC). The ML signal is 1-week cadence so hourly rebuilds were
    # wasteful. 6 runs/day keeps the frozen price fresh enough and stays well under
    # NewsAPI's 100-call/day free limit. For on-demand refresh use workflow_dispatch.
    - cron: '17 */4 * * *'
  workflow_dispatch: {}        # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:                     # rebuild the site when the app or pipeline changes
      - 'src/**'
      - 'backend/**'
      - 'scripts/validate_frozen_payload.py'
      - 'freeze.py'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write              # publish gh-pages and mutable state on live-data

concurrency:
  group: pages-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # Keep generated state off protected main. The live-data branch is seeded
      # before this workflow ships; missing or partial state therefore fails closed.
      - name: Restore mutable runtime state from live-data
        env:
          STATE_BRANCH: live-data
          STATE_DIRECTORY: runtime-state
          STATE_MARKER: .initialized-v1
          STATE_RESTORE_DIR: ${{ runner.temp }}/wti-state-restore
        run: |
          set -euo pipefail
          mkdir -p "$STATE_RESTORE_DIR"

          expected_origin="https://github.com/${GITHUB_REPOSITORY}"
          origin_url="$(git remote get-url origin)"
          if [ "${origin_url%.git}" != "$expected_origin" ]; then
            echo "Refusing unexpected git origin" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if git fetch --no-tags origin \
              "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to fetch mutable runtime state after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          marker_path="${STATE_DIRECTORY}/${STATE_MARKER}"
          marker_mode="$(git ls-tree "origin/${STATE_BRANCH}" -- "$marker_path" | awk '{print $1}')"
          if [ "$marker_mode" != "100644" ]; then
            echo "Runtime-state initialization marker is missing or invalid" >&2
            exit 1
          fi

          for state_file in signal_state.json live_track_record.json; do
            branch_path="${STATE_DIRECTORY}/${state_file}"
            state_mode="$(git ls-tree "origin/${STATE_BRANCH}" -- "$branch_path" | awk '{print $1}')"
            if [ "$state_mode" != "100644" ]; then
              echo "Runtime state is missing, partial, or not a regular file" >&2
              exit 1
            fi

            restore_path="${STATE_RESTORE_DIR}/${state_file}"
            git show "origin/${STATE_BRANCH}:${branch_path}" > "$restore_path"
            python -m json.tool "$restore_path" >/dev/null
            cp "$restore_path" "data/.${state_file}.tmp"
            mv "data/.${state_file}.tmp" "data/${state_file}"
            echo "Restored ${branch_path}"
          done

          # Syntax is not enough: fail closed unless both restored objects satisfy
          # the same structural contracts used by the runtime writers.
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -c \
            'from backend.live_record import load_record; from backend.signal_alert import load_state; load_record(); load_state()'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt

      - name: Freeze data snapshot -> public/data.json
        env:
          EAGER_ML_WARMUP: 'true'
          # Tolerate missing external APIs so a deploy never fails on a transient API outage;
          # the price/ML core still produces a valid snapshot.
          MIN_REQUIRED_EXTERNAL_SOURCES: '0'
          # Optional provider credentials. The pipeline degrades gracefully when absent.
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          USDA_NASS_KEY: ${{ secrets.USDA_NASS_KEY }}
          NOAA_CDO_KEY: ${{ secrets.NOAA_CDO_KEY }}
        run: python freeze.py --out public

      - name: Validate frozen payload invariants
        run: python scripts/validate_frozen_payload.py public/data.json --max-age-minutes 30

      - name: Record + resolve live 1W track record
        run: python backend/live_record.py --data public/data.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure resilient npm downloads
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install JS dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "npm registry error; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Lint frontend (ESLint — real bugs only, no style)
        run: npm run lint

      # Only the shipped dependency tree can reach a visitor's browser, so a
      # vulnerability there blocks the deploy. Build-only devDependencies (eslint,
      # vite) never leave the runner, and a fresh upstream advisory in that chain must
      # not freeze the dashboard on stale prices — which is exactly what happened when
      # GHSA-rgw5-rvv9-x895 landed in eslint's brace-expansion. tests.yml still fails
      # the full audit on every pull request and on its weekly schedule, so a dev-tree
      # advisory is still caught and still blocks code changes.
      - name: Audit shipped JS dependencies
        # A real advisory still fails this step. A registry/network error (the 2026-09-03 deploy
        # died on an npm advisory-endpoint timeout) is retried, then only warned: an unreachable
        # audit endpoint is not a vulnerability. Must never freeze the live dashboard on stale prices over a transient outage.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if output="$(npm audit --omit=dev --audit-level=low 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            if printf '%s' "$output" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|socket hang up|fetch failed'; then
              echo "npm audit registry/network error on attempt ${attempt}" >&2
              if [ "$attempt" -eq 3 ]; then
                echo "::warning title=npm audit unreachable::The npm advisory endpoint was unreachable after 3 attempts, so this audit was skipped for this run. It is re-run on every pull request and on the weekly Tests schedule."
                exit 0
              fi
              sleep $((attempt * 20))
              continue
            fi
            printf '%s\n' "$output"
            exit 1
          done

      - name: Report build-only dependency advisories
        run: |
          if ! npm audit --audit-level=low; then
            echo "::warning title=Build-only dependency advisory::npm audit reported an advisory outside the shipped dependency tree. The deploy continued because these packages are not served to visitors. Fix it via the Tests workflow, which still fails on this."
          fi

      - name: Build static site (Vite copies public/data.json into dist/)
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_LIVE_PRICE_URL: https://raw.githubusercontent.com/${{ github.repository }}/live-data/price.json
          # In static mode the app loads data.json once — no need to re-poll every 15s.
          VITE_POLL_INTERVAL_MS: '86400000'
        run: npm run build

      - name: Deploy to GitHub Pages
        id: pages_deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # Never announce a stance that was not successfully published.
      - name: Check 1W signal and send alert on stance change
        env:
          # Add GMAIL_APP_PASSWORD as a GitHub Secret to enable email alerts.
          # Generate at: myaccount.google.com > Security > App passwords
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: navnoorquant@gmail.com
          ALERT_EMAIL: navnoorquant@gmail.com
        run: python backend/signal_alert.py --data public/data.json

      # Persist only after a successful Pages publish. The explicit status check
      # lets the live record persist even if alert delivery itself fails, while
      # signal_alert.py leaves an unsent stance unchanged so the next run retries.
      - name: Persist signal state + live record to live-data branch
        if: ${{ !cancelled() && steps.pages_deploy.outcome == 'success' }}
        env:
          STATE_SNAPSHOT_DIR: ${{ runner.temp }}/wti-state-snapshot
          STATE_BRANCH: live-data
          STATE_DIRECTORY: runtime-state
          STATE_MARKER: .initialized-v1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_origin="https://github.com/${GITHUB_REPOSITORY}"
          origin_url="$(git remote get-url origin)"
          if [ "${origin_url%.git}" != "$expected_origin" ]; then
            echo "Refusing unexpected git origin" >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth_header}"
          mkdir -p "$STATE_SNAPSHOT_DIR"
          cp data/signal_state.json "$STATE_SNAPSHOT_DIR/signal_state.json"
          cp data/live_track_record.json "$STATE_SNAPSHOT_DIR/live_track_record.json"

          state_worktree=""
          cleanup_worktree() {
            if [ -n "$state_worktree" ] && [ -d "$state_worktree" ]; then
              git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worktree EXIT

          git worktree prune
          for attempt in 1 2 3; do
            state_worktree="${RUNNER_TEMP}/wti-state-worktree-${attempt}"

            if ! git fetch --no-tags origin \
              "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
              echo "git fetch failed on attempt ${attempt}" >&2
            elif git worktree add --detach "$state_worktree" "origin/${STATE_BRANCH}"; then
              state_directory_path="$state_worktree/$STATE_DIRECTORY"
              if [ -L "$state_directory_path" ] || \
                { [ -e "$state_directory_path" ] && [ ! -d "$state_directory_path" ]; }; then
                echo "Refusing unsafe runtime-state directory" >&2
                exit 1
              fi
              mkdir -p "$state_directory_path"
              if [ ! -f "$state_directory_path/$STATE_MARKER" ] || \
                [ -L "$state_directory_path/$STATE_MARKER" ]; then
                echo "Runtime-state initialization marker is unavailable" >&2
                exit 1
              fi

              cp --remove-destination -- "$STATE_SNAPSHOT_DIR/signal_state.json" \
                "$state_worktree/$STATE_DIRECTORY/signal_state.json"
              cp --remove-destination -- "$STATE_SNAPSHOT_DIR/live_track_record.json" \
                "$state_worktree/$STATE_DIRECTORY/live_track_record.json"
              git -C "$state_worktree" add \
                "$STATE_DIRECTORY/signal_state.json" \
                "$STATE_DIRECTORY/live_track_record.json"

              if git -C "$state_worktree" diff --staged --quiet; then
                echo "Signal state unchanged — no commit"
                git worktree remove "$state_worktree"
                state_worktree=""
                exit 0
              fi

              git -C "$state_worktree" config user.name "WTI Signal Bot"
              git -C "$state_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$state_worktree" commit -m "chore: refresh runtime state [skip ci]"
              if git -C "$state_worktree" \
                -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
                -c http.followRedirects=false \
                push origin "HEAD:${STATE_BRANCH}"; then
                git worktree remove "$state_worktree"
                state_worktree=""
                exit 0
              fi

              echo "git push raced with another live-data update on attempt ${attempt}" >&2
              git worktree remove --force "$state_worktree"
              state_worktree=""
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to persist signal state after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
