name: Refresh frozen dashboard

# Re-freezes the live data into static JSON and redeploys the site to GitHub Pages.
# No running server required — the published site is pure static HTML/JS + a data.json
# snapshot. If a run fails (e.g. an upstream API is rate-limited), the previous good
# snapshot stays live and the next scheduled run retries.
#
# Least privilege: the `build` job runs every third-party install and build tool with a
# read-only token, and the only secret it receives is the EIA API key the supply-shock study
# reads. The `publish` job holds the write token and nothing else, and installs and builds
# nothing: besides GitHub's own checkout, artifact and Python setup actions, it runs only git
# and this repository's own standard-library scripts against the artifacts `build` produced,
# and deploys with a plain git push.

on:
  schedule:
    # Every 4 hours (UTC). The forecast is a daily one (next five sessions, from the last
    # settled session), so six runs a day record each session's forecast and settle the record
    # within hours of the data. GitHub runs schedules best-effort and delays or drops runs under
    # load, so gaps of several hours happen; the dashboard shows the snapshot's age, and the
    # record never depends on a run landing at a particular time. For an on-demand refresh use
    # workflow_dispatch.
    - cron: '17 */4 * * *'
  workflow_dispatch: {}        # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:                     # rebuild the site when the app, pipeline or published research changes
      - 'src/**'
      - 'backend/**'
      - 'data/vol_lab.json'
      - 'data/vol_forecast_validation.json'
      - 'data/wf_*.json'
      - 'data/carry_signal_test.json'
      - 'data/supply_shock_study.json'
      - 'data/leak_anatomy.json'
      - 'data/research_ledger.json'
      - 'data/eia_wti_spot_daily.json'
      - 'data/market/**'
      - 'scripts/build_research_bundle.py'
      - 'scripts/validate_frozen_payload.py'
      - 'freeze.py'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'

permissions:
  contents: read

concurrency:
  group: pages-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Freeze and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # Keep generated state off protected main. The live-data branch is seeded
      # (runtime-state/vol_track_record.json from `python backend/vol_record.py --init`) before
      # this workflow ships; missing or invalid state therefore fails closed instead of silently
      # restarting the forward record. The tree it restored from goes to publish with the state,
      # so publish can refuse to overwrite state that another run persisted after this one
      # restored it.
      - name: Restore mutable runtime state from live-data
        env:
          STATE_BRANCH: live-data
          STATE_DIRECTORY: runtime-state
          STATE_MARKER: .initialized-v1
          STATE_RESTORE_DIR: ${{ runner.temp }}/wti-state-restore
          STATE_BASE_FILE: ${{ runner.temp }}/runtime-state/restored-from
        run: |
          set -euo pipefail
          mkdir -p "$STATE_RESTORE_DIR"

          expected_origin="https://github.com/${GITHUB_REPOSITORY}"
          origin_url="$(git remote get-url origin)"
          if [ "${origin_url%.git}" != "$expected_origin" ]; then
            echo "Refusing unexpected git origin" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if git fetch --no-tags origin \
              "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to fetch mutable runtime state after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          marker_path="${STATE_DIRECTORY}/${STATE_MARKER}"
          marker_mode="$(git ls-tree "origin/${STATE_BRANCH}" -- "$marker_path" | awk '{print $1}')"
          if [ "$marker_mode" != "100644" ]; then
            echo "Runtime-state initialization marker is missing or invalid" >&2
            exit 1
          fi

          state_file=vol_track_record.json
          branch_path="${STATE_DIRECTORY}/${state_file}"
          state_mode="$(git ls-tree "origin/${STATE_BRANCH}" -- "$branch_path" | awk '{print $1}')"
          if [ "$state_mode" != "100644" ]; then
            echo "Runtime state is missing or not a regular file" >&2
            exit 1
          fi

          restore_path="${STATE_RESTORE_DIR}/${state_file}"
          git show "origin/${STATE_BRANCH}:${branch_path}" > "$restore_path"
          python -m json.tool "$restore_path" >/dev/null
          cp "$restore_path" "data/.${state_file}.tmp"
          mv "data/.${state_file}.tmp" "data/${state_file}"
          echo "Restored ${branch_path}"

          # Syntax is not enough: fail closed unless the restored record satisfies the
          # structural contract its writer enforces (standard library only, nothing installed).
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -c \
            'from backend.vol_record import load_record; load_record()'

          mkdir -p "$(dirname "$STATE_BASE_FILE")"
          {
            echo "tree=$(git rev-parse "origin/${STATE_BRANCH}:${STATE_DIRECTORY}")"
            echo "commit=$(git rev-parse "origin/${STATE_BRANCH}")"
          } > "$STATE_BASE_FILE"
          cat "$STATE_BASE_FILE"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt

      - name: Freeze data snapshot -> public/data.json
        env:
          # The only credential production uses: the supply-shock study's EIA spot history. It is
          # optional; without it the study keeps its committed cache.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python freeze.py --out public

      # frozen_at is stamped seconds earlier in this job, so its age proves nothing; the quote's
      # own exchange time catches a provider that silently serves a stale series (4 days covers
      # a holiday weekend).
      - name: Validate frozen payload invariants
        run: python scripts/validate_frozen_payload.py public/data.json --max-age-minutes 30 --max-market-age-days 4 --research public/research.json

      # Appends this snapshot's vol forecast (one per session, first issuance wins), settles the
      # forecasts whose target week has closed, and writes the summary into public/data.json
      # (vol_forecast.live_record) before the site is built from it. The new entry is sealed only
      # in the publish job, right before it is committed.
      - name: Record + resolve live vol track record
        run: python backend/vol_record.py --data public/data.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure resilient npm downloads
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000

      # --ignore-scripts: no dependency lifecycle script ever runs; the toolchain needs none.
      - name: Install JS dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "npm registry error; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Lint frontend (ESLint — real bugs only, no style)
        run: npm run lint

      # Only the shipped dependency tree can reach a visitor's browser, so a
      # vulnerability there blocks the deploy. Build-only devDependencies (eslint,
      # vite) never leave the runner, so an upstream advisory in that chain, which may
      # have no fix to take yet, must not stop the dashboard from refreshing its prices.
      # tests.yml still fails the full audit on every pull request and on its weekly
      # schedule, so a dev-tree advisory is still caught and still blocks code changes.
      - name: Audit shipped JS dependencies
        # A real advisory fails this step. A registry or network error from the advisory
        # endpoint is retried, then only warned: an unreachable audit endpoint is not a
        # vulnerability, and a transient outage must not leave the live dashboard on stale prices.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if output="$(npm audit --omit=dev --audit-level=low 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            if printf '%s' "$output" | grep -qiE 'audit endpoint returned an error|network timeout|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|socket hang up|fetch failed'; then
              echo "npm audit registry/network error on attempt ${attempt}" >&2
              if [ "$attempt" -eq 3 ]; then
                echo "::warning title=npm audit unreachable::The npm advisory endpoint was unreachable after 3 attempts, so this audit was skipped for this run. It is re-run on every pull request and on the weekly Tests schedule."
                exit 0
              fi
              sleep $((attempt * 20))
              continue
            fi
            printf '%s\n' "$output"
            exit 1
          done

      - name: Report build-only dependency advisories
        run: |
          if ! npm audit --audit-level=low; then
            echo "::warning title=Build-only dependency advisory::npm audit reported an advisory outside the shipped dependency tree. The deploy continued because these packages are not served to visitors. Fix it via the Tests workflow, which still fails on this."
          fi

      - name: Build static site (Vite copies public/data.json into dist/)
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_LIVE_PRICE_URL: https://raw.githubusercontent.com/${{ github.repository }}/live-data/price.json
          # Static mode re-reads data.json every 15 minutes so an open tab picks up each new
          # snapshot (an unchanged file is a cheap conditional request).
          VITE_POLL_INTERVAL_MS: '900000'
        run: npm run build

      # Joins the restored-from record the restore step wrote there.
      - name: Stage runtime state for the publish job
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/runtime-state/restored-from"
          cp data/vol_track_record.json "${RUNNER_TEMP}/runtime-state/"

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Upload runtime state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-state
          path: ${{ runner.temp }}/runtime-state/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Deploy and persist state
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write              # publish gh-pages and mutable state on live-data
    steps:
      # Nothing is installed or built in this job and no third-party action runs in it: only
      # GitHub's own actions below, git, and this repository's standard-library scripts from a
      # fresh checkout of this commit ever run next to the write token, and no secret reaches it
      # (tests/test_workflow_guards.py enforces the allowlist).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Download runtime state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-state
          path: ${{ runner.temp }}/runtime-state

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The artifacts are data from the build job; the state is checked against the structural
      # contracts its runtime writers enforce before anything acts on it.
      - name: Place build outputs
        run: |
          set -euo pipefail
          mkdir -p public
          cp dist/data.json public/data.json
          cp dist/research.json public/research.json
          cp "${RUNNER_TEMP}/runtime-state/vol_track_record.json" data/vol_track_record.json
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -c \
            'from backend.vol_record import load_record; load_record()'

      # Normal runs never trip this (the concurrency group serializes them), but a re-run of an old
      # run's publish job ("Re-run failed jobs", artifacts live 3 days) would deploy an older site
      # and overwrite the live record that later runs persisted. It also validates the exact bytes
      # being deployed: dist/data.json, after vol_record.py added its summary in the build job.
      # A superseded build fails here on purpose, before deploying or persisting: a green run
      # would look like the re-run had delivered its snapshot. Start a new run instead.
      - name: Refuse a stale or superseded build
        env:
          STATE_BRANCH: live-data
          STATE_DIRECTORY: runtime-state
          STATE_BASE_FILE: ${{ runner.temp }}/runtime-state/restored-from
          PAGES_BRANCH: gh-pages
        run: |
          set -euo pipefail
          cmp dist/data.json public/data.json

          base_tree="$(sed -n 's/^tree=//p' "$STATE_BASE_FILE")"
          if ! [[ "$base_tree" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "The build did not record which runtime state it restored" >&2
            exit 1
          fi
          for branch in "$STATE_BRANCH" "$PAGES_BRANCH"; do
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to fetch ${branch} after 3 attempts" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done

          if [ "$(git rev-parse "origin/${STATE_BRANCH}:${STATE_DIRECTORY}")" != "$base_tree" ]; then
            echo "::error title=Superseded build::Runtime state on ${STATE_BRANCH} changed after this build restored it (a later run, or an earlier attempt of this one, persisted since). Nothing was deployed or persisted; start a new run."
            exit 1
          fi

          # The live site's own snapshot time; unreadable counts as unknown (nothing to protect).
          published_at="$(git show "origin/${PAGES_BRANCH}:data.json" 2>/dev/null \
            | python -c 'import json, sys; print(json.load(sys.stdin).get("frozen_at") or "")')" || published_at=""
          checks=(--max-age-minutes 240 --research public/research.json)
          if [ -n "$published_at" ]; then
            checks+=(--not-older-than "$published_at")
          fi
          if ! python scripts/validate_frozen_payload.py public/data.json "${checks[@]}"; then
            echo "::error title=Not published::This build's payload is invalid, over 4 hours old, or older than the live site's (${published_at:-unknown}). Nothing was deployed or persisted; start a new run."
            exit 1
          fi

      # A plain git push with this job's token, so no third-party action holds it. The branch's
      # files become exactly dist/ plus .nojekyll, committed on top of the branch's history as
      # "deploy: <commit>" and pushed without force; an unchanged site is not committed. The commit
      # is authored by github-actions[bot], not by the run's actor (a scheduled deploy is not the
      # work of whoever last edited the schedule). The gh-pages branch must already exist.
      - name: Deploy to GitHub Pages
        id: pages_deploy
        env:
          PAGES_BRANCH: gh-pages
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_origin="https://github.com/${GITHUB_REPOSITORY}"
          origin_url="$(git remote get-url origin)"
          if [ "${origin_url%.git}" != "$expected_origin" ]; then
            echo "Refusing unexpected git origin" >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth_header}"

          site_worktree=""
          cleanup_worktree() {
            if [ -n "$site_worktree" ] && [ -d "$site_worktree" ]; then
              git worktree remove --force "$site_worktree" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worktree EXIT

          git worktree prune
          for attempt in 1 2 3; do
            site_worktree="${RUNNER_TEMP}/wti-site-worktree-${attempt}"

            if ! git fetch --no-tags --depth=1 origin \
              "+refs/heads/${PAGES_BRANCH}:refs/remotes/origin/${PAGES_BRANCH}"; then
              echo "git fetch failed on attempt ${attempt}" >&2
            elif git worktree add --detach "$site_worktree" "origin/${PAGES_BRANCH}"; then
              git -C "$site_worktree" rm -r -q --ignore-unmatch -- .
              cp -RL dist/. "$site_worktree/"
              touch "$site_worktree/.nojekyll"
              git -C "$site_worktree" add --all

              if git -C "$site_worktree" diff --staged --quiet; then
                echo "The published site already matches this build"
                git worktree remove "$site_worktree"
                site_worktree=""
                exit 0
              fi

              git -C "$site_worktree" config user.name "github-actions[bot]"
              git -C "$site_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$site_worktree" commit -q -m "deploy: ${GITHUB_SHA}"
              if git -C "$site_worktree" \
                -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
                -c http.followRedirects=false \
                push origin "HEAD:${PAGES_BRANCH}"; then
                git worktree remove "$site_worktree"
                site_worktree=""
                exit 0
              fi

              echo "git push to ${PAGES_BRANCH} failed on attempt ${attempt}" >&2
              git worktree remove --force "$site_worktree"
              site_worktree=""
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to deploy the site after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      # Persist only after a successful Pages publish, so the record never runs ahead of the
      # summary the site shows. The state goes on top of the tree this build restored, never over
      # a newer one. Right before the commit, --seal stamps sealed_at on the entries this run
      # added; one whose scoring window opens within vol_record.SEAL_MARGIN (5 minutes) of that
      # stamp becomes late_commit and is never scored. The step's 4-minute limit keeps the commit
      # and push inside that margin, so every entry sealed in time was committed before the
      # settlement that opens its window. The site above was built before the seal, so it shows a
      # late entry as pending until the next run.
      - name: Persist live vol track record to live-data branch
        if: ${{ !cancelled() && steps.pages_deploy.outcome == 'success' }}
        timeout-minutes: 4
        env:
          STATE_SNAPSHOT_DIR: ${{ runner.temp }}/wti-state-snapshot
          STATE_BRANCH: live-data
          STATE_DIRECTORY: runtime-state
          STATE_MARKER: .initialized-v1
          STATE_BASE_FILE: ${{ runner.temp }}/runtime-state/restored-from
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_origin="https://github.com/${GITHUB_REPOSITORY}"
          origin_url="$(git remote get-url origin)"
          if [ "${origin_url%.git}" != "$expected_origin" ]; then
            echo "Refusing unexpected git origin" >&2
            exit 1
          fi

          base_tree="$(sed -n 's/^tree=//p' "$STATE_BASE_FILE")"
          if ! [[ "$base_tree" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "The build did not record which runtime state it restored" >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth_header}"

          # Standard library only, like the load_record check.
          PYTHONDONTWRITEBYTECODE=1 python backend/vol_record.py --seal
          mkdir -p "$STATE_SNAPSHOT_DIR"
          cp data/vol_track_record.json "$STATE_SNAPSHOT_DIR/vol_track_record.json"

          state_worktree=""
          cleanup_worktree() {
            if [ -n "$state_worktree" ] && [ -d "$state_worktree" ]; then
              git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_worktree EXIT

          git worktree prune
          for attempt in 1 2 3; do
            state_worktree="${RUNNER_TEMP}/wti-state-worktree-${attempt}"

            if ! git fetch --no-tags origin \
              "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
              echo "git fetch failed on attempt ${attempt}" >&2
            elif git worktree add --detach "$state_worktree" "origin/${STATE_BRANCH}"; then
              state_directory_path="$state_worktree/$STATE_DIRECTORY"
              if [ -L "$state_directory_path" ] || \
                { [ -e "$state_directory_path" ] && [ ! -d "$state_directory_path" ]; }; then
                echo "Refusing unsafe runtime-state directory" >&2
                exit 1
              fi
              mkdir -p "$state_directory_path"
              if [ ! -f "$state_directory_path/$STATE_MARKER" ] || \
                [ -L "$state_directory_path/$STATE_MARKER" ]; then
                echo "Runtime-state initialization marker is unavailable" >&2
                exit 1
              fi

              cp --remove-destination -- "$STATE_SNAPSHOT_DIR/vol_track_record.json" \
                "$state_worktree/$STATE_DIRECTORY/vol_track_record.json"
              git -C "$state_worktree" add "$STATE_DIRECTORY/vol_track_record.json"

              if git -C "$state_worktree" diff --staged --quiet; then
                echo "Vol track record unchanged — no commit"
                git worktree remove "$state_worktree"
                state_worktree=""
                exit 0
              fi

              if [ "$(git rev-parse "origin/${STATE_BRANCH}:${STATE_DIRECTORY}")" != "$base_tree" ]; then
                echo "::error title=Superseded build::Runtime state on ${STATE_BRANCH} changed after this build restored it; refusing to overwrite the newer state."
                exit 1
              fi

              git -C "$state_worktree" config user.name "WTI Vol Record Bot"
              git -C "$state_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$state_worktree" commit -m "chore: update vol track record [skip ci]"
              if git -C "$state_worktree" \
                -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
                -c http.followRedirects=false \
                push origin "HEAD:${STATE_BRANCH}"; then
                git worktree remove "$state_worktree"
                state_worktree=""
                exit 0
              fi

              echo "git push raced with another live-data update on attempt ${attempt}" >&2
              git worktree remove --force "$state_worktree"
              state_worktree=""
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to persist the vol track record after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
