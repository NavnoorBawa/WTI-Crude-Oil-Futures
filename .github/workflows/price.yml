name: Refresh live price

# Fetches the latest WTI front-month quote and writes price.json to the dedicated
# live-data branch. The dashboard reads it through raw.githubusercontent.com, whose
# CORS policy allows the Pages site to consume it directly. Keeping price ticks off
# gh-pages prevents every 15-minute update from launching a full Pages deployment.
#
# Quote/provider and transient GitHub API outages are best-effort: the previous good
# file remains live and the run emits a warning. Authentication/configuration errors
# still fail visibly.

on:
  schedule:
    # Avoid the top-of-hour load spike where GitHub schedules are most often delayed.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-price-${{ github.repository }}
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch and publish WTI quote
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_live_price.py
