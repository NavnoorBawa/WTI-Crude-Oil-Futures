name: Reproduce research artifact

# Rebuilds data/vol_lab.json from the pinned market-data snapshot (data/market/, SHA-256 digests in
# MANIFEST.json) and requires it to match the committed artifact. The rebuild is offline: nothing is
# downloaded after the dependency install. It runs when anything the artifact is computed from
# changes, weekly (a new runner image or a dependency's numerics must not silently move the
# published results), and on demand. Read-only token; no secrets.

on:
  pull_request:
    paths:
      - 'backend/vol_lab.py'
      - 'backend/forecast_eval.py'
      - 'backend/market_data.py'
      - 'backend/vol_forecast.py'
      - 'backend/contract_calendar.py'
      - 'data/market/**'
      - 'data/vol_lab.json'
      - 'requirements*.txt'
      - 'tests/test_vol_lab.py'
      - '.github/workflows/reproduce.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/vol_lab.py'
      - 'backend/forecast_eval.py'
      - 'backend/market_data.py'
      - 'backend/vol_forecast.py'
      - 'backend/contract_calendar.py'
      - 'data/market/**'
      - 'data/vol_lab.json'
      - 'requirements*.txt'
      - 'tests/test_vol_lab.py'
      - '.github/workflows/reproduce.yml'
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproduce:
    name: Rebuild data/vol_lab.json
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # A pinned numeric environment: one thread everywhere, OpenBLAS's AVX2 kernel and NumPy's AVX2
      # code paths, so Intel (AVX-512) and AMD runner hosts execute the same instructions and the
      # rebuild can be bit for bit. Where it is not, backend/vol_lab.py compare_reports decides:
      # every model set, flag, label and count must be identical and every number equal to 1e-4
      # relative or to the last decimal it is published with (the GARCH refits converge tightly, so
      # kernel differences stay near 2e-5). data/vol_lab.json is generated under these variables.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
          python -m pip check

      - name: Record the numeric environment
        run: |
          set -euo pipefail
          grep -m1 'model name' /proc/cpuinfo || true
          python - <<'PY'
          import platform

          import numpy as np
          import scipy
          import scipy.linalg  # noqa: F401 - loads SciPy's own OpenBLAS so it is listed too
          from threadpoolctl import threadpool_info

          print("python", platform.python_version(), "numpy", np.__version__, "scipy", scipy.__version__)
          for pool in threadpool_info():
              print({key: pool.get(key) for key in ("internal_api", "prefix", "version", "architecture", "num_threads")})
          PY

      - name: Verify the snapshot digests
        run: python -B -c "from backend.market_data import load_snapshot; load_snapshot()"

      - name: Rebuild the artifact and compare
        id: reproduce
        env:
          RUN_SLOW: '1'
          VOL_LAB_REBUILT: ${{ runner.temp }}/vol_lab.rebuilt.json
        run: python -B -m unittest -v tests.test_vol_lab.ArtifactContractTest.test_artifact_reproduces_from_the_snapshot

      - name: Describe the comparison
        # Bit for bit, floating-point noise only (backend/vol_lab.py compare_reports), or which
        # conclusions moved.
        if: ${{ !cancelled() && steps.reproduce.outcome != 'skipped' }}
        env:
          VOL_LAB_REBUILT: ${{ runner.temp }}/vol_lab.rebuilt.json
        run: |
          set -euo pipefail
          test -f "$VOL_LAB_REBUILT" || { echo "### The rebuild did not finish" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python -B - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os

          from backend.vol_lab import REPRO_REL_TOL, compare_reports

          committed = json.loads(open("data/vol_lab.json", encoding="utf-8").read())
          rebuilt = json.loads(open(os.environ["VOL_LAB_REBUILT"], encoding="utf-8").read())
          diff = compare_reports(committed, rebuilt)
          if diff["identical"]:
              print("### Rebuild: bit for bit identical")
          elif not diff["violations"]:
              print(f"### Rebuild: every conclusion identical; {diff['numbers_differing']} numbers differ "
                    f"in the last bits (largest {diff['largest_relative_difference']:.1e} relative, "
                    f"tolerance {REPRO_REL_TOL:g} or the published last place)")
          else:
              print(f"### Rebuild: {len(diff['violations'])} differences beyond floating-point noise")
              for line in diff["violations"][:30]:
                  print(f"- `{line}`")
          PY

      - name: Summarize the artifact
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.reproduce.outcome }}
        run: |
          set -euo pipefail
          python -B - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          report = json.loads(open("data/vol_lab.json", encoding="utf-8").read())
          snapshot = report["generated_from"]
          sample = report["sample"]
          board = report["leaderboard"]
          verdict = {"success": "reproduced", "failure": "DID NOT reproduce",
                     "skipped": "not run"}.get(os.environ.get("OUTCOME", ""), "not run")

          print(f"### data/vol_lab.json: {verdict}")
          print()
          print(f"Snapshot retrieved {snapshot['retrieved_at']}, sessions through {snapshot['sessions_through']}.")
          print()
          print("| Input | Rows | First | Last | SHA-256 |")
          print("|---|---:|---|---|---|")
          for entry in snapshot["files"].values():
              print(f"| `{entry['file']}` | {entry['rows']} | {entry['first']} | {entry['last']} | `{entry['sha256']}` |")
          print()
          print("| Result | Value |")
          print("|---|---|")
          print(f"| Out-of-sample sample | {sample['n_days']} days, {sample['n_weeks']} weeks, "
                f"{sample['first']} to {sample['last']} |")
          print(f"| Model of record | `{report['config']['champion']}` |")
          print(f"| 90% MCS (QLIKE) | {', '.join(f'`{m}`' for m in board['mcs_qlike_included'])} |")
          print(f"| 90% MCS (MSE) | {', '.join(f'`{m}`' for m in board['mcs_mse_included'])} |")
          print(f"| Challenger | `{report['config']['challenger']}` |")
          PY
